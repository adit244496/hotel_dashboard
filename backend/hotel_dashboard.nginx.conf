# Reverse proxy for the Hotel Performance Dashboard.
#
# The app serves its own frontend, so nginx only forwards to 127.0.0.1:8016 —
# there is no static root to configure.
#
#   sudo cp hotel_dashboard.nginx.conf /etc/nginx/sites-available/hotel_dashboard
#   sudo ln -s /etc/nginx/sites-available/hotel_dashboard /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d hospkpi.ambujaneotia.com
#
# This file is deliberately HTTP-only. certbot reads server_name from this
# block, obtains the certificate, then rewrites the file to add the TLS server
# and the http->https redirect. Shipping a TLS block here instead would refer to
# certificate files that do not exist yet, and nginx -t fails on a missing
# certificate — so certbot could never run to create it.
#
# Do not add "http2 on;" by hand: that form needs nginx 1.25.1 or newer and is
# rejected outright by the 1.24 that Ubuntu 24.04 ships. On older nginx the
# equivalent is the http2 parameter on the listen directive, which certbot
# leaves alone; add it there if you want it.

server {
    listen 80;
    listen [::]:80;
    server_name hospkpi.ambujaneotia.com;

    # MIS workbooks are large; the biggest sample is about 4 MB.
    client_max_body_size 50M;

    access_log /var/log/nginx/hotel_dashboard.access.log;
    error_log  /var/log/nginx/hotel_dashboard.error.log;

    location / {
        proxy_pass http://127.0.0.1:8016;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Parsing a large workbook on upload can take a while.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
