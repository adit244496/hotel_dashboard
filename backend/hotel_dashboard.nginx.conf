# Reverse proxy for the Hotel Performance Dashboard.
#
# The application serves its own frontend, so nginx only needs to terminate TLS
# and forward everything to the app on 127.0.0.1:8016.
#
#   sudo cp hotel_dashboard.nginx.conf /etc/nginx/sites-available/hotel_dashboard
#   sudo ln -s /etc/nginx/sites-available/hotel_dashboard /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name hospkpi.ambujaneotia.com;

    # Serve the ACME challenge, then send everything else to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name hospkpi.ambujaneotia.com;

    ssl_certificate     /etc/letsencrypt/live/hospkpi.ambujaneotia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hospkpi.ambujaneotia.com/privkey.pem;

    # MIS workbooks can be large (the biggest sample is ~4 MB).
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8016;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Parsing a large workbook on upload can take a while.
        proxy_read_timeout 300s;
    }
}
