# Reverse proxy for the Hotel Performance Dashboard.
#
# The app serves its own frontend, so nginx only terminates TLS and forwards
# everything to 127.0.0.1:8016 — there is no separate static root to configure.
#
#   sudo cp hotel_dashboard.nginx.conf /etc/nginx/sites-available/hotel_dashboard
#   sudo ln -s /etc/nginx/sites-available/hotel_dashboard /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# For the certificate:
#   sudo certbot --nginx -d hospkpi.ambujaneotia.com

server {
    listen 80;
    server_name hospkpi.ambujaneotia.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name hospkpi.ambujaneotia.com;

    ssl_certificate     /etc/letsencrypt/live/hospkpi.ambujaneotia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hospkpi.ambujaneotia.com/privkey.pem;

    # MIS workbooks are large; the biggest sample is about 4 MB.
    client_max_body_size 50M;

    access_log /var/log/nginx/hotel_dashboard.access.log;
    error_log  /var/log/nginx/hotel_dashboard.error.log;

    location / {
        proxy_pass http://127.0.0.1:8016;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Parsing a large workbook on upload can take a while.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
